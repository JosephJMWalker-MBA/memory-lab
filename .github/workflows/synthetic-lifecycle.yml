name: Synthetic lifecycle

on:
  push:
  pull_request:

jobs:
  synthetic-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run environment-independent lifecycle regression
        run: python3 tests/run_synthetic_lifecycle.py

      - name: Run synthetic state-machine failure semantics
        run: python3 tests/run_failure_semantics.py

      - name: Run public contract schema validation
        run: python3 tests/run_contract_schema_validation.py

      - name: Run experimental derived-memory v0 semantics
        run: python3 tests/run_derived_memory_v0.py

      - name: Run adversarial derived-memory semantics
        run: python3 tests/run_derived_memory_adversarial.py

      - name: Run dependency-aware derived reassessment
        run: python3 tests/run_derived_reassessment_v0.py

      - name: Run multiple independent justification semantics
        run: python3 tests/run_multiple_justifications_v0.py

      - name: Run derived conflict consistency semantics
        run: python3 tests/run_derived_conflict_v0.py

      - name: Run Graphiti substitution adapter semantics and recorded-evidence check
        run: python3 tests/run_graphiti_adapter_v0.py

      - name: Run current-view admission vs application-state baseline
        run: python3 tests/run_appstate_baseline_v0.py

      - name: Run coverage decision-value logic and recorded SciFact evidence check
        run: python3 tests/run_coverage_scifact_v0.py
